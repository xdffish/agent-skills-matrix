name: Publish VS Code extension

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check whether the version changed
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          current=$(node -p "require('./package.json').version")
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            previous=$(git show "$BEFORE_SHA:package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>console.log(JSON.parse(s).version))')
            if [ "$current" = "$previous" ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: npm ci
      - name: Check types
        if: steps.version.outputs.publish == 'true'
        run: npm run type-check
      - name: Check VS Code Marketplace publisher
        id: publisher
        if: steps.version.outputs.publish == 'true'
        run: |
          publisher=$(node -p "require('./package.json').publisher")
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://marketplace.visualstudio.com/publishers/$publisher")
          if [ "$status" = "200" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Publisher '$publisher' is not available on the VS Code Marketplace; skipping that publish step."
          fi
      - name: Publish to Visual Studio Marketplace
        if: steps.version.outputs.publish == 'true' && steps.publisher.outputs.ready == 'true'
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --no-dependencies
      - name: Package for Open VSX
        if: steps.version.outputs.publish == 'true' && env.OVSX_PAT != ''
        run: npx --yes @vscode/vsce@4.1.0 package --no-dependencies -o agent-skills-matrix.vsix
      - name: Publish to Open VSX
        if: steps.version.outputs.publish == 'true' && env.OVSX_PAT != ''
        run: npx --yes ovsx@latest publish agent-skills-matrix.vsix -p "$OVSX_PAT"
